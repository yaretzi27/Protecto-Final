<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow & Care | Arma tu Rutina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Glow & Care</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="quienes-somos.html">Quiénes Somos</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link active" href="rutina.html">Mi Rutina</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- AQUÍ ESTÁ LA IMAGEN AGREGADA -->
                <div class="text-center mb-4">
                    <img src="./img/dachshund.jpeg" alt="Rutina de cuidado de la piel" class="imagen-rutina">
                </div>

                <h1 class="text-center mb-3">Descubre tu Rutina Ideal</h1>
                <p class="text-center text-muted mb-4">Responde este breve cuestionario y te recomendaremos los mejores productos.</p>
                
                <form id="formRutina">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Tu Nombre:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="tipo-piel" class="form-label">¿Cuál es tu tipo de piel?</label>
                        <select class="form-select" id="tipo-piel" name="tipo-piel" required>
                            <option value="">Selecciona una opción</option>
                            <option value="grasa">Grasa</option>
                            <option value="seca">Seca</option>
                            <option value="mixta">Mixta</option>
                            <option value="normal">Normal</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="preocupacion" class="form-label">¿Cuál es tu principal preocupación?</label>
                        <select class="form-select" id="preocupacion" name="preocupacion">
                            <option value="acne">Acné</option>
                            <option value="manchas">Manchas</option>
                            <option value="arrugas">Arrugas</option>
                            <option value="hidratacion">Hidratación</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="comentarios" class="form-label">Comentarios adicionales (opcional):</label>
                        <textarea class="form-control" id="comentarios" name="comentarios" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn w-100" id="btnGenerar">Generar mi Rutina</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 mt-5">
        <p>&copy; 2024 Glow & Care. Todos los derechos reservados.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Tu JS -->
    <script src="script.js"></script>
</body>
</html>
